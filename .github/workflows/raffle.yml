name: Update 50/50 total

on:
  schedule:
    # Every 30 minutes. GitHub runs scheduled jobs on a best-effort basis and
    # they often land 5-20 minutes late under load, so treat this as "about
    # every half hour" rather than on the clock.
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: raffle-total
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Read the Zeffy total
        env:
          ZEFFY_API_KEY: ${{ secrets.ZEFFY_API_KEY }}
          ZEFFY_CAMPAIGN_ID: ${{ vars.ZEFFY_CAMPAIGN_ID }}
          ZEFFY_CAMPAIGN_MATCH: ${{ vars.ZEFFY_CAMPAIGN_MATCH }}
          ZEFFY_AMOUNT_IN_CENTS: ${{ vars.ZEFFY_AMOUNT_IN_CENTS }}
          ZEFFY_RAISED_FIELD: ${{ vars.ZEFFY_RAISED_FIELD }}
        run: python scripts/update_raffle.py

      - name: Commit if the number moved
        run: |
          git add data.json
          if git diff --cached --quiet; then
            echo "Total unchanged, nothing to commit."
            exit 0
          fi
          git config user.name "keystone-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "50/50 total update"
          git push
